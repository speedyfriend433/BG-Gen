<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Customizable Shader Player</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- p5.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  </head>
  <body>
    <!-- Controls – similar to Shadertoy's UI -->
    <div id="controls">
      <label for="shaderSelect">Select Shader:</label>
      <select id="shaderSelect">
        <option value="swirly">Swirly Pattern</option>
        <option value="fieldflow">Field Flow</option>
        <option value="fbm3d">FBM 3D</option>
      </select>

      <!-- Swirly Pattern Controls -->
      <div id="swirlyControls" class="shaderControls" style="display: none;">
        <label for="noiseSpeed">Noise Speed:</label>
        <input type="range" id="noiseSpeed" min="0" max="0.5" step="0.01" value="0.1" />
        <label for="swirlFactor">Swirl Factor:</label>
        <input type="range" id="swirlFactor" min="1" max="100" step="1" value="20" />
        <label for="smoothEdge1">Smooth Edge Low:</label>
        <input type="range" id="smoothEdge1" min="0" max="1" step="0.01" value="0.1" />
        <label for="smoothEdge2">Smooth Edge High:</label>
        <input type="range" id="smoothEdge2" min="0" max="1" step="0.01" value="0.3" />
        <label for="colorLow">Low Color:</label>
        <input type="color" id="colorLow" value="#191919" />
        <label for="colorHigh">High Color:</label>
        <input type="color" id="colorHigh" value="#333399" />
      </div>

      <!-- Field Flow Controls -->
      <div id="fieldFlowControls" class="shaderControls" style="display: none;">
        <label for="flowMult">Flow Multiplier:</label>
        <input type="range" id="flowMult" min="0.001" max="0.01" step="0.0005" value="0.003125" />
      </div>

      <!-- FBM 3D Controls -->
      <div id="fbm3dControls" class="shaderControls" style="display: none;">
        <label for="numOct">Number of Octaves:</label>
        <input type="range" id="numOct" min="1" max="8" step="1" value="4" />
        <label for="uvScale">UV Scale:</label>
        <input type="range" id="uvScale" min="0.5" max="5.0" step="0.1" value="2.5" />
      </div>
    </div>

    <!-- Shared Vertex Shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">
      attribute vec3 aPosition;
      attribute vec2 aTexCoord;
      varying vec2 vTexCoord;
      
      void main() {
          vTexCoord = aTexCoord;
          gl_Position = vec4(aPosition, 1.0);
      }
    </script>

    <!-- Swirly Pattern Fragment Shader -->
    <script id="swirly-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif

      uniform vec2 u_resolution;
      uniform float u_time;
      uniform float u_noiseSpeed;
      uniform float u_swirlFactor;
      uniform float u_smoothEdge1;
      uniform float u_smoothEdge2;
      uniform vec3 u_colorLow;
      uniform vec3 u_colorHigh;

      // Simple 2D noise function
      float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }
      
      float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
      }
      
      void main(){
          vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
          uv = vec2(noise(uv + u_time * u_noiseSpeed), noise(uv + 10.0));
          float d = uv.x - uv.y;
          d *= u_swirlFactor;
          d = sin(d);
          d = d * 0.5 + 0.5;
          d = 1.0 - d;
          d = smoothstep(u_smoothEdge1, u_smoothEdge2, d);
          vec3 col = mix(u_colorLow, u_colorHigh, d);
          gl_FragColor = vec4(col, 1.0);
      }
    </script>

    <!-- Field Flow Fragment Shader -->
    <script id="fieldflow-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif

      uniform vec2 u_resolution;
      uniform float u_time;
      uniform sampler2D u_channel0;
      uniform float u_flowMult;

      // Rotation helpers
      vec2 Rot(vec2 p, float t) {
          float c = cos(t), s = sin(t);
          return vec2(p.x * c + p.y * s, -p.x * s + p.y * c);
      }
      vec2 RotCS(vec2 p, float c, float s) {
          return vec2(p.x * c + p.y * s, -p.x * s + p.y * c);
      }
      
      // Custom random function
      float random(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }
      
      // Rename our custom noise function to avoid overload issues.
      float fbmNoise(vec3 p) {
          vec2 i = floor(p.yz);
          vec2 f = fract(p.yz);
          float a = random(i + vec2(0.0, 0.0));
          float b = random(i + vec2(1.0, 0.0));
          float c = random(i + vec2(0.0, 1.0));
          float d = random(i + vec2(1.0, 1.0));
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
      }
      
      // pot() returns a noise–based value from pos.
      float pot(vec2 pos) {
          float t = u_time * 0.1;
          vec3 p = vec3(pos + vec2(u_time * 0.4, 0.0), t);
          float n = fbmNoise(p);
          n += 0.5 * fbmNoise(p * 2.13);
          n += 3.0 * fbmNoise(vec3(pos * 0.333, 0.0));
          return n;
      }
      
      // Field function returns a 2D vector field.
      vec2 field(vec2 pos) {
          float s = 1.5;
          pos *= s;
          float n = pot(pos);
          float e = 0.1;
          float nx = pot(pos + vec2(e, 0.0));
          float ny = pot(pos + vec2(0.0, e));
          return vec2(-(ny - n), nx - n) / e;
      }
      
      // Pseudorandom function for vec3 input.
      vec3 random3(vec3 c) {
          float j = 4096.0 * sin(dot(c, vec3(17.0, 59.4, 15.0)));
          vec3 r;
          r.z = fract(512.0 * j);
          j *= 0.125;
          r.x = fract(512.0 * j);
          j *= 0.125;
          r.y = fract(512.0 * j);
          r = r - 0.5;
          float t = -u_time * 0.5;
          r.xy = Rot(r.xy, t);
          return r;
      }
      
      const float F3 = 0.3333333;
      const float G3 = 0.1666667;
      
      void main(){
          float lod = 0.0;
          vec2 uv = gl_FragCoord.xy;
          uv /= u_resolution.xy;
          uv.x *= u_resolution.x / u_resolution.y;
          uv.y = 1.0 - uv.y;
          vec3 d = vec3(0.0);
          vec3 e = vec3(0.0);
          for (int i = 0; i < 25; i++) {
              d += texture2D(u_channel0, uv + u_time * 0.05, lod).xyz;
              e += texture2D(u_channel0, -uv.yx * 3.0 + u_time * 0.0125, lod).xyz;
              vec2 new_uv = field(uv) * u_flowMult;
              lod += length(new_uv) * 5.0;
              uv += new_uv;
          }
          vec3 c = texture2D(u_channel0, uv * 0.1 + u_time * 0.025, lod).xyz;
          d *= (1.0 / 50.0);
          e *= (1.0 / 50.0);
          c = mix(c, d, length(d));
          c = mix(c, e, length(e));
          gl_FragColor = vec4(c, 1.0);
      }
    </script>

    <!-- FBM 3D Fragment Shader (by philip.bertani@gmail.com) -->
    <script id="fbm3d-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif

      uniform vec2 u_resolution;
      uniform float u_time;
      // Customizable parameters:
      uniform float u_numOct;   // number of FBM octaves
      uniform float u_uvScale;  // scales the UV coordinates

      #define pi 3.14159265

      float random(vec2 p) {
          return fract(sin(dot(p, vec2(12.0, 90.0))) * 5e5);
      }

      mat2 rot2(float an) {
          float cc = cos(an), ss = sin(an);
          return mat2(cc, -ss, ss, cc);
      }

      float noise(vec3 p) {
          vec2 i = floor(p.yz);
          vec2 f = fract(p.yz);
          float a = random(i + vec2(0.0, 0.0));
          float b = random(i + vec2(1.0, 0.0));
          float c = random(i + vec2(0.0, 1.0));
          float d = random(i + vec2(1.0, 1.0));
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
      }

      float focus;
      float focus2;

      float fbm3d(vec3 p) {
          float v = 0.0;
          float a = 0.35;
          for (float i = 0.0; i < 10.0; i++) {
              if(i >= u_numOct) break;
              v += a * noise(p);
              a *= 0.25 * (1.2 + focus + focus2);
          }
          return v;
      }

      void mainImage(out vec4 fragColor, in vec2 fragCoord) {
          vec2 uv = (2.0 * fragCoord - u_resolution.xy) / u_resolution.y * u_uvScale;
          float aspectRatio = u_resolution.x / u_resolution.y;
          vec3 rd = normalize(vec3(uv, -1.2));
          vec3 ro = vec3(0.0);
          float delta = u_time / 1.5;
          rd.yz *= rot2(-delta / 2.0);
          rd.xz *= rot2(delta * 3.0);
          vec3 p = ro + rd;
          float bass = 1.5 + 0.5 * max(0.0, 2.0 * sin(u_time * 3.0));
          vec2 nudge = vec2(aspectRatio * cos(u_time * 1.5), sin(u_time * 1.5));
          focus = length(uv + nudge);
          focus = 2.0 / (1.0 + focus) * bass;
          focus2 = length(uv - nudge);
          focus2 = 4.0 / (1.0 + focus2 * focus2) / bass;
          vec3 q = vec3(
              fbm3d(p),
              fbm3d(p.yzx),
              fbm3d(p.zxy)
          );
          float f = fbm3d(p + q);
          vec3 cc = q;
          cc *= 20.0 * f;
          cc.r += 5.0 * focus; cc.g += 3.5 * focus;
          cc.b += 7.0 * focus2; cc.r -= 3.5 * focus2;
          cc /= 25.0;
          fragColor = vec4(cc, 1.0);
      }

      void main(){
          mainImage(gl_FragColor, gl_FragCoord.xy);
      }
    </script>

    <!-- Include the main script file -->
    <script src="script.js"></script>
  </body>
</html>
