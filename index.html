<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Customizable Shader Player</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- p5.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  </head>
  <body>
    <!-- The player container fills the viewport -->
    <div id="player"></div>

    <!-- UI Controls overlay -->
    <div id="controls">
      <label for="shaderSelect">Select Shader:</label>
      <select id="shaderSelect">
        <option value="swirly">Swirly Pattern</option>
        <option value="hex">Hex Shader</option>
        <option value="fbm3d">FBM 3D</option>
      </select>

      <!-- Swirly Pattern Controls -->
      <div id="swirlyControls" class="shaderControls" style="display: none;">
        <label for="noiseSpeed">Noise Speed:</label>
        <input type="range" id="noiseSpeed" min="0" max="0.5" step="0.01" value="0.1" />
        <label for="swirlFactor">Swirl Factor:</label>
        <input type="range" id="swirlFactor" min="1" max="100" step="1" value="20" />
        <label for="smoothEdge1">Smooth Edge Low:</label>
        <input type="range" id="smoothEdge1" min="0" max="1" step="0.01" value="0.1" />
        <label for="smoothEdge2">Smooth Edge High:</label>
        <input type="range" id="smoothEdge2" min="0" max="1" step="0.01" value="0.3" />
        <label for="colorLow">Low Color:</label>
        <input type="color" id="colorLow" value="#191919" />
        <label for="colorHigh">High Color:</label>
        <input type="color" id="colorHigh" value="#333399" />
      </div>

      <!-- Hex Shader Controls (no adjustable parameters in this example) -->
      <div id="hexControls" class="shaderControls" style="display: none;">
        <p>Fixed parameters.</p>
      </div>

      <!-- FBM 3D Controls -->
      <div id="fbm3dControls" class="shaderControls" style="display: none;">
        <label for="numOct">Number of Octaves:</label>
        <input type="range" id="numOct" min="1" max="8" step="1" value="4" />
        <label for="uvScale">UV Scale:</label>
        <input type="range" id="uvScale" min="0.5" max="5.0" step="0.1" value="2.5" />
      </div>
    </div>

    <!-- Shared Vertex Shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">
      attribute vec3 aPosition;
      attribute vec2 aTexCoord;
      varying vec2 vTexCoord;
      
      void main() {
          vTexCoord = aTexCoord;
          gl_Position = vec4(aPosition, 1.0);
      }
    </script>

    <!-- Swirly Pattern Fragment Shader -->
    <script id="swirly-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif

      // Fixed resolution for this shader
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform float u_noiseSpeed;
      uniform float u_swirlFactor;
      uniform float u_smoothEdge1;
      uniform float u_smoothEdge2;
      uniform vec3 u_colorLow;
      uniform vec3 u_colorHigh;

      // Simple 2D noise function
      float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123);
      }
      
      float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          float a = hash(i);
          float b = hash(i + vec2(1.0,0.0));
          float c = hash(i + vec2(0.0,1.0));
          float d = hash(i + vec2(1.0,1.0));
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
      }
      
      void main(){
          // Map full canvas to a coordinate system with y-range ±1
          vec2 uv = (2.0 * gl_FragCoord.xy - u_resolution.xy) / u_resolution.y;
          uv = vec2(noise(uv + u_time * u_noiseSpeed), noise(uv + 10.0));
          float d = uv.x - uv.y;
          d *= u_swirlFactor;
          d = sin(d);
          d = d * 0.5 + 0.5;
          d = 1.0 - d;
          d = smoothstep(u_smoothEdge1, u_smoothEdge2, d);
          vec3 col = mix(u_colorLow, u_colorHigh, d);
          gl_FragColor = vec4(col, 1.0);
      }
    </script>

    <!-- Hex Shader Fragment Shader (updated version) -->
    <script id="hex-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif

      // Use a fixed resolution of 1024×576.
      uniform vec2 u_resolution;
      uniform float u_time;

      #define TAU 6.2831853
      #define ZIGZAG(x) (1.0 - abs(1.0 - 2.0 * fract(x)))

      // Instead of using bit‑wise HEX, we hard‐code constant colors.
      const vec3 c0 = vec3(112.0,192.0,255.0) / 255.0;
      const vec3 c1 = vec3(255.0,112.0,192.0) / 255.0;
      const vec3 c2 = vec3(255.0,208.0,112.0) / 255.0;
      const vec3 c3 = vec3(207.0,128.0,224.0) / 255.0;
      const vec3 c4 = vec3(112.0,255.0,192.0) / 255.0;
      const vec3 c5 = vec3(255.0,168.0,224.0) / 255.0;

      // Interpolates between constant colors.
      vec3 getColor(float x){
          const float colorCount = 6.0;
          float index = x * colorCount;
          float lo = floor(index);
          float t = smoothstep(0.95, 1.0, fract(index));
          vec3 a;
          vec3 b;
          if(lo < 0.5) a = c0;
          else if(lo < 1.5) a = c1;
          else if(lo < 2.5) a = c2;
          else if(lo < 3.5) a = c3;
          else if(lo < 4.5) a = c4;
          else a = c5;
          float hi = lo + 1.0;
          if(hi >= colorCount) hi = 0.0;
          if(hi < 0.5) b = c0;
          else if(hi < 1.5) b = c1;
          else if(hi < 2.5) b = c2;
          else if(hi < 3.5) b = c3;
          else if(hi < 4.5) b = c4;
          else b = c5;
          return mix(a,b,t);
      }

      #define COLWID 0.4

      void mainImage(out vec4 fragColor, in vec2 fragCoord) {
          float time = fract(u_time / 4.0);
          // Compute coordinates using fixed resolution.
          vec2 uvR = 2.0 * fragCoord - u_resolution;
          vec2 uv = uvR / length(u_resolution);
          // Clamp to avoid log(0): use a small epsilon.
          float r2 = max(uv.x * uv.x + uv.y * uv.y, 1e-6);
          float lenSq = log(r2);
          float angle = atan(uv.y, uv.x) / TAU;
          
          float val = ZIGZAG(0.22 * lenSq - angle + time) * COLWID + 0.05 * lenSq + 2.0 * time;
          vec3 col = getColor(fract(val));
          fragColor = vec4(col, 1.0);
      }

      void main(){
          mainImage(gl_FragColor, gl_FragCoord.xy);
      }
    </script>

    <!-- FBM 3D Fragment Shader (by philip.bertani; unchanged) -->
    <script id="fbm3d-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif

      uniform vec2 u_resolution;
      uniform float u_time;
      uniform float u_numOct;
      uniform float u_uvScale;

      #define pi 3.14159265

      float random(vec2 p) {
          return fract(sin(dot(p, vec2(12.0, 90.0))) * 5e5);
      }

      mat2 rot2(float an) {
          float cc = cos(an), ss = sin(an);
          return mat2(cc, -ss, ss, cc);
      }

      // Rename noise to myNoise
      float myNoise(vec3 p) {
          vec2 i = floor(p.yz);
          vec2 f = fract(p.yz);
          float a = random(i + vec2(0.0));
          float b = random(i + vec2(1.0,0.0));
          float c = random(i + vec2(0.0,1.0));
          float d = random(i + vec2(1.0,1.0));
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
      }

      float focus;
      float focus2;

      float fbm3d(vec3 p) {
          float v = 0.0;
          float a = 0.35;
          for (float i = 0.0; i < 10.0; i++) {
              if(i >= u_numOct) break;
              v += a * myNoise(p);
              a *= 0.25 * (1.2 + focus + focus2);
          }
          return v;
      }

      void mainImage(out vec4 fragColor, in vec2 fragCoord) {
          vec2 uv = (2.0 * fragCoord - u_resolution.xy) / u_resolution.y * u_uvScale;
          float aspectRatio = u_resolution.x / u_resolution.y;
          vec3 rd = normalize(vec3(uv, -1.2));
          vec3 ro = vec3(0.0);
          float delta = u_time / 1.5;
          rd.yz *= rot2(-delta / 2.0);
          rd.xz *= rot2(delta * 3.0);
          vec3 p = ro + rd;
          float bass = 1.5 + 0.5 * max(0.0, 2.0 * sin(u_time * 3.0));
          vec2 nudge = vec2(aspectRatio * cos(u_time * 1.5), sin(u_time * 1.5));
          focus = length(uv + nudge);
          focus = 2.0 / (1.0 + focus) * bass;
          focus2 = length(uv - nudge);
          focus2 = 4.0 / (1.0 + focus2 * focus2) / bass;
          vec3 q = vec3(
              fbm3d(p),
              fbm3d(p.yzx),
              fbm3d(p.zxy)
          );
          float f = fbm3d(p + q);
          vec3 cc = q;
          cc *= 20.0 * f;
          cc.r += 5.0 * focus; cc.g += 3.5 * focus;
          cc.b += 7.0 * focus2; cc.r -= 3.5 * focus2;
          cc /= 25.0;
          fragColor = vec4(cc, 1.0);
      }

      void main(){
          mainImage(gl_FragColor, gl_FragCoord.xy);
      }
    </script>

    <!-- Include the main script file -->
    <script src="script.js"></script>
  </body>
</html>
