<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Customizable Shader Backgrounds</title>
    <!-- p5.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        color: #fff;
        font-family: sans-serif;
        z-index: 10;
        max-width: 220px;
      }
      #controls input,
      #controls select {
        margin: 5px 0;
        width: 100%;
      }
      #controls label {
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <!-- UI Controls -->
    <div id="controls">
      <label for="shaderSelect">Select Shader:</label>
      <select id="shaderSelect">
        <option value="metaballs">Metaballs</option>
        <option value="swirly">Swirly Pattern</option>
        <option value="fieldflow">Field Flow</option>
      </select>
      
      <!-- Controls for the Swirly Pattern shader -->
      <div id="swirlyControls" style="display:none;">
        <label for="noiseSpeed">Noise Speed:</label>
        <input type="range" id="noiseSpeed" min="0" max="0.5" step="0.01" value="0.1" />
        
        <label for="swirlFactor">Swirl Factor:</label>
        <input type="range" id="swirlFactor" min="1" max="100" step="1" value="20" />
        
        <label for="smoothEdge1">Smooth Edge Low:</label>
        <input type="range" id="smoothEdge1" min="0" max="1" step="0.01" value="0.1" />
        
        <label for="smoothEdge2">Smooth Edge High:</label>
        <input type="range" id="smoothEdge2" min="0" max="1" step="0.01" value="0.3" />
        
        <label for="colorLow">Low Color:</label>
        <input type="color" id="colorLow" value="#191919" />
        
        <label for="colorHigh">High Color:</label>
        <input type="color" id="colorHigh" value="#333399" />
      </div>
      
      <!-- Controls for the Field Flow shader -->
      <div id="fieldFlowControls" style="display:none;">
        <label for="flowMult">Flow Multiplier:</label>
        <input type="range" id="flowMult" min="0.001" max="0.01" step="0.0005" value="0.003125" />
      </div>
    </div>

    <!-- Shared Vertex Shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">
      attribute vec3 aPosition;
      attribute vec2 aTexCoord;
      varying vec2 vTexCoord;
      
      void main() {
        vTexCoord = aTexCoord;
        gl_Position = vec4(aPosition, 1.0);
      }
    </script>

    <!-- Metaballs Fragment Shader -->
    <script id="fragment-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif
      
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_ballPos[4];
      uniform float u_ballRadius[4];
      
      void main() {
        vec2 st = gl_FragCoord.xy / u_resolution;
        float strength = 0.0;
        for (int i = 0; i < 4; i++) {
          vec2 center = u_ballPos[i];
          float radius = u_ballRadius[i];
          float d = distance(st, center);
          strength += radius / d;
        }
        vec3 color = vec3(0.0);
        if (strength > 1.0) {
          float t = mod(u_time + strength, 3.1416);
          color = vec3(0.5 + 0.5 * sin(t),
                       0.5 + 0.5 * cos(t),
                       0.5 + 0.5 * sin(t * 2.0));
        }
        gl_FragColor = vec4(color, 1.0);
      }
    </script>

    <!-- Swirly Pattern Fragment Shader -->
    <script id="swirly-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif
      
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform float u_noiseSpeed;
      uniform float u_swirlFactor;
      uniform float u_smoothEdge1;
      uniform float u_smoothEdge2;
      uniform vec3 u_colorLow;
      uniform vec3 u_colorHigh;
      
      // 2D noise function
      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }
      
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
      }
      
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
        uv = vec2(noise(uv + u_time * u_noiseSpeed), noise(uv + 10.0));
        float d = uv.x - uv.y;
        d *= u_swirlFactor;
        d = sin(d);
        d = d * 0.5 + 0.5;
        d = 1.0 - d;
        d = smoothstep(u_smoothEdge1, u_smoothEdge2, d);
        vec3 col = mix(u_colorLow, u_colorHigh, d);
        gl_FragColor = vec4(col, 1.0);
      }
    </script>

    <!-- Field Flow Fragment Shader (adapted from Nikita Miropolskiy's shader) -->
    <script id="fieldflow-shader" type="x-shader/x-fragment">
      #ifdef GL_ES
      precision mediump float;
      #endif
      
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform sampler2D u_channel0;  // the noise texture
      uniform float u_flowMult;      // multiplier for field flow
      
      // Rotation functions
      vec2 Rot(vec2 p, float t) {
        float c = cos(t);
        float s = sin(t);
        return vec2(p.x * c + p.y * s,
                    -p.x * s + p.y * c);
      }
      vec2 RotCS(vec2 p, float c, float s) {
        return vec2(p.x * c + p.y * s,
                    -p.x * s + p.y * c);
      }
      
      // "Pot" function using noise (calls 3D noise)
      float pot(vec2 pos)
      {
        float t = u_time * 0.1;
        vec3 p = vec3(pos + vec2(u_time * 0.4, 0.0), t);
        float n = noise(p);
        n += 0.5 * noise(p * 2.13);
        n += 3.0 * noise(pos * 0.333);
        return n;
      }
      
      // Field function: returns a 2d vector field from pos
      vec2 field(vec2 pos)
      {
        float s = 1.5;
        pos *= s;
        float n = pot(pos);
        float e = 0.1;
        float nx = pot(pos + vec2(e, 0.0));
        float ny = pot(pos + vec2(0.0, e));
        return vec2(-(ny - n), nx - n) / e;
      }
      
      // discontinuous pseudorandom uniformly distributed in [-0.5,0.5]^3
      vec3 random3(vec3 c) {
        float j = 4096.0 * sin(dot(c, vec3(17.0, 59.4, 15.0)));
        vec3 r;
        r.z = fract(512.0 * j);
        j *= 0.125;
        r.x = fract(512.0 * j);
        j *= 0.125;
        r.y = fract(512.0 * j);
        r = r - 0.5;
        float t = -u_time * 0.5;
        r.xy = Rot(r.xy, t);
        return r;
      }
      
      const float F3 = 0.3333333;
      const float G3 = 0.1666667;
      
      // 3D simplex noise
      float noise(vec3 p) {
        vec3 s = floor(p + dot(p, vec3(F3)));
        vec3 x = p - s + dot(s, vec3(G3));
        
        vec3 e = step(vec3(0.0), x - x.yzx);
        vec3 i1 = e * (1.0 - e.zxy);
        vec3 i2 = 1.0 - e.zxy * (1.0 - e);
        
        vec3 x1 = x - i1 + G3;
        vec3 x2 = x - i2 + 2.0 * G3;
        vec3 x3 = x - 1.0 + 3.0 * G3;
        
        vec4 w, d;
        w.x = dot(x, x);
        w.y = dot(x1, x1);
        w.z = dot(x2, x2);
        w.w = dot(x3, x3);
        
        w = max(0.6 - w, 0.0);
        w = w * w;
        w = w * w;
        
        d.x = dot(random3(s), x);
        d.y = dot(random3(s + i1), x1);
        d.z = dot(random3(s + i2), x2);
        d.w = dot(random3(s + vec3(1.0)), x3);
        
        return dot(d, vec4(52.0));
      }
      
      // iq 2D simplex noise
      vec2 hash(vec2 p)
      {
        p = vec2(dot(p, vec2(127.1, 311.7)),
                 dot(p, vec2(269.5, 183.3)));
        vec2 h = -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
        float t = -u_time * 0.7;
        float co = cos(t);
        float si = sin(t);
        h = RotCS(h, co, si);
        return h;
      }
      
      float noise(in vec2 p)
      {
        const float K1 = 0.366025404;
        const float K2 = 0.211324865;
        vec2 i = floor(p + (p.x + p.y) * K1);
        vec2 a = p - i + (i.x + i.y) * K2;
        vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec2 b = a - o + K2;
        vec2 c = a - 1.0 + 2.0 * K2;
        float t = u_time * 0.5;
        float co = cos(t);
        float si = sin(t);
        a = RotCS(a, co, si);
        b = RotCS(b, co, si);
        c = RotCS(c, co, si);
        vec3 h = max(vec3(0.5 - vec3(dot(a,a), dot(b,b), dot(c,c)), 0.0));
        vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
        return dot(n, vec3(70.0));
      }
      
      void main(){
        float lod = 0.0;
        vec2 uv = gl_FragCoord.xy;
        uv /= u_resolution.xy;
        uv.x *= u_resolution.x / u_resolution.y;
        uv.y = 1.0 - uv.y;
        vec3 d = vec3(0.0);
        vec3 e = vec3(0.0);
        for (int i = 0; i < 25; i++){
          d += texture2D(u_channel0, uv + u_time * 0.05, lod).xyz;
          e += texture2D(u_channel0, -uv.yx * 3.0 + u_time * 0.0125, lod).xyz;
          vec2 new_uv = field(uv) * u_flowMult;
          lod += length(new_uv) * 5.0;
          uv += new_uv;
        }
        vec3 c = texture2D(u_channel0, uv * 0.1 + u_time * 0.025, lod).xyz;
        d *= (1.0 / 50.0);
        e *= (1.0 / 50.0);
        c = mix(c, d, length(d));
        c = mix(c, e, length(e));
        gl_FragColor = vec4(c, 1.0);
      }
    </script>

    <!-- Main p5.js Sketch -->
    <script>
      let shaderMetaballs, shaderSwirly, shaderFieldFlow, currentShader;
      let noiseTexture;
      
      function setup() {
        createCanvas(windowWidth, windowHeight, WEBGL);
        // Ensure the quad covers the canvas correctly.
        rectMode(CENTER);
        noStroke();
        
        // Retrieve shader sources
        const vert = document.getElementById('vertex-shader').textContent;
        const metaFrag = document.getElementById('fragment-shader').textContent;
        const swirlyFrag = document.getElementById('swirly-shader').textContent;
        const fieldFlowFrag = document.getElementById('fieldflow-shader').textContent;
        
        // Create shader objects
        shaderMetaballs = createShader(vert, metaFrag);
        shaderSwirly = createShader(vert, swirlyFrag);
        shaderFieldFlow = createShader(vert, fieldFlowFrag);
        
        // Default shader is metaballs.
        currentShader = shaderMetaballs;
        
        // Create a noise texture for Field Flow (256x256 grayscale)
        noiseTexture = createGraphics(256, 256);
        noiseTexture.loadPixels();
        for (let x = 0; x < 256; x++) {
          for (let y = 0; y < 256; y++) {
            let index = 4 * (x + y * 256);
            let val = floor(random(0, 255));
            noiseTexture.pixels[index] = val;
            noiseTexture.pixels[index + 1] = val;
            noiseTexture.pixels[index + 2] = val;
            noiseTexture.pixels[index + 3] = 255;
          }
        }
        noiseTexture.updatePixels();
        
        // Listen to shader selection changes
        const shaderSelect = document.getElementById('shaderSelect');
        shaderSelect.addEventListener('change', function() {
          if (this.value === 'metaballs') {
            currentShader = shaderMetaballs;
            document.getElementById('swirlyControls').style.display = 'none';
            document.getElementById('fieldFlowControls').style.display = 'none';
          } else if (this.value === 'swirly') {
            currentShader = shaderSwirly;
            document.getElementById('swirlyControls').style.display = 'block';
            document.getElementById('fieldFlowControls').style.display = 'none';
          } else if (this.value === 'fieldflow') {
            currentShader = shaderFieldFlow;
            document.getElementById('swirlyControls').style.display = 'none';
            document.getElementById('fieldFlowControls').style.display = 'block';
          }
        });
      }
      
      function draw() {
        shader(currentShader);
        currentShader.setUniform("u_resolution", [width, height]);
        currentShader.setUniform("u_time", millis() / 1000.0);
        
        if (currentShader === shaderMetaballs) {
          // Metaballs uniforms:
          let ballPositions = [];
          let ballRadii = [];
          for (let i = 0; i < 4; i++) {
            let angle = (millis() / 1000.0) * (0.5 + i * 0.3);
            let x = 0.5 + 0.3 * cos(angle + i);
            let y = 0.5 + 0.3 * sin(angle + i + 1.0);
            ballPositions.push(x, y);
            let radius = 0.15 + 0.05 * sin(millis() / 1000.0 + i);
            ballRadii.push(radius);
          }
          currentShader.setUniform("u_ballPos", ballPositions);
          currentShader.setUniform("u_ballRadius", ballRadii);
        } else if (currentShader === shaderSwirly) {
          // Swirly Pattern uniforms from UI controls:
          let noiseSpeed = parseFloat(document.getElementById('noiseSpeed').value);
          let swirlFactor = parseFloat(document.getElementById('swirlFactor').value);
          let smoothEdge1 = parseFloat(document.getElementById('smoothEdge1').value);
          let smoothEdge2 = parseFloat(document.getElementById('smoothEdge2').value);
          function hexToRgb(hex) {
            let bigint = parseInt(hex.slice(1), 16);
            let r = ((bigint >> 16) & 255) / 255;
            let g = ((bigint >> 8) & 255) / 255;
            let b = (bigint & 255) / 255;
            return [r, g, b];
          }
          let colorLow = hexToRgb(document.getElementById('colorLow').value);
          let colorHigh = hexToRgb(document.getElementById('colorHigh').value);
          
          currentShader.setUniform("u_noiseSpeed", noiseSpeed);
          currentShader.setUniform("u_swirlFactor", swirlFactor);
          currentShader.setUniform("u_smoothEdge1", smoothEdge1);
          currentShader.setUniform("u_smoothEdge2", smoothEdge2);
          currentShader.setUniform("u_colorLow", colorLow);
          currentShader.setUniform("u_colorHigh", colorHigh);
        } else if (currentShader === shaderFieldFlow) {
          // Field Flow uniforms:
          let flowMult = parseFloat(document.getElementById('flowMult').value);
          currentShader.setUniform("u_flowMult", flowMult);
          currentShader.setUniform("u_channel0", noiseTexture);
        }
        
        // Draw a rectangle covering the full canvas.
        rect(0, 0, width, height);
      }
      
      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </body>
</html>
